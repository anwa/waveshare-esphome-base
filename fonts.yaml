# ==============================================================================
# SHARED FONTS
# ==============================================================================
#
# Roboto 500 in every size used by the shared UI. The built-in Montserrat fonts
# have no umlauts, so German UI text needs these custom fonts.
#
# Google Fonts are downloaded at build time, never by the running display.
# Every size carries the same glyph set: the Latin kernel plus German umlauts
# and the typographic symbols used by the projects.
#
# Font IDs name the pixel size: font_14, font_16, font_18, font_20, font_24,
# font_28, font_32 and font_48.
# ==============================================================================

font:
  - file: gfonts://Roboto@500
    id: font_14
    size: 14
    bpp: 4
    glyphsets: [GF_Latin_Kernel]
    glyphs: ["ÄÖÜäöüß°€…–·"]

  - file: gfonts://Roboto@500
    id: font_16
    size: 16
    bpp: 4
    glyphsets: [GF_Latin_Kernel]
